<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayla Giveaway Hunter</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;font:15px system-ui}body{margin:0;padding:18px;background:var(--tg-theme-bg-color,#0b1019);color:var(--tg-theme-text-color,#e8edf5)}h1{font-size:23px}.card{border:1px solid #35445a;background:var(--tg-theme-secondary-bg-color,#152033);padding:15px;border-radius:14px;margin:12px 0}a{color:var(--tg-theme-link-color,#7ab7ff)}.muted{opacity:.7}label{display:block;padding:8px 0}button{background:#2563eb;border:0;border-radius:10px;color:white;padding:11px 16px}#error{color:#ffb4b4}</style></head><body><h1>🎁 Ayla Giveaway Hunter</h1><p class="muted">Розіграші та завдання</p><button id="refresh">Оновити</button><p id="error"></p><div id="items"></div><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const data=tg?.initData||'';const root=document.getElementById('items');const error=document.getElementById('error');
async function request(url,method='GET',body){let r=await fetch(url,{method,headers:{'X-Telegram-Init-Data':data,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function element(tag,text){let x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x}
async function load(){root.replaceChildren();error.textContent='';if(!data){error.textContent='Відкрий Mini App кнопкою всередині Telegram.';return}try{const response=await request('/api/miniapp/giveaways');if(!response.items.length){root.append(element('p','Розіграшів поки немає.'));return}for(const g of response.items){const card=element('article');card.className='card';card.append(element('h3',g.title),element('p','Приз: '+(g.prize||'не вказано')+' · Ризик: '+g.risk_score+'/100'));const a=element('a','Переглянути розіграш');a.href=g.source_url;a.target='_blank';a.rel='noopener noreferrer';card.append(a);for(const t of g.tasks){const label=element('label'),cb=element('input');cb.type='checkbox';cb.checked=!!t.completed;cb.onchange=async()=>{try{await request('/api/miniapp/tasks/'+t.id,'PATCH',{completed:cb.checked})}catch(e){cb.checked=!cb.checked;error.textContent=e.message}};label.append(cb,document.createTextNode(' '+t.description));card.append(label)}root.append(card)}}catch(e){error.textContent='Помилка завантаження: '+e.message}}
document.getElementById('refresh').onclick=load;load();
</script></body></html>
